# Значения по умолчанию для настроек приложения.
# Правило раздела 0 ТЗ: магических чисел в коде нет — всё, что может меняться, лежит здесь.
# Схема и валидация — cam/core/config.py (AppDefaults). Неизвестные ключи отвергаются.

geometry:
  chord_tolerance_mm: 0.01       # хордовый допуск при разбиении сплайнов/эллипсов (7.2)
  stitch_tolerance_mm: 0.01      # допуск совпадения концов сегментов при сшивке (7.2)
  min_segment_length_mm: 0.001   # сегменты короче считаются нулевыми и удаляются (7.2)

storage:
  backups_keep: 10               # сколько последних резервных копий базы хранить (18)

ui:
  font_point_size: 12            # цеховой компьютер: крупный шрифт (17)
  window_title: "Furniture CAM"
