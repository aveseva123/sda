# Разворачивается на локальном сервере в цеху. Интернет нужен один раз — при
# первой сборке образов; дальше платформа работает в изолированной сети.
#
# Имя проекта задано явно: иначе Docker берёт его из имени папки, и стоит
# папку переименовать или перенести — платформа откроется пустой, потому что
# тома с базой и файлами останутся под старым именем.
name: nestor

services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sda}
      POSTGRES_DB: ${POSTGRES_DB:-sda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sda}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      # Только с самого сервера: база с паролем по умолчанию не должна быть
      # видна всему цеху. Для внешнего доступа задайте POSTGRES_BIND=0.0.0.0
      # и обязательно смените пароль в .env.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sda}:${POSTGRES_PASSWORD:-sda}@db:5432/${POSTGRES_DB:-sda}
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /config
      STORAGE_DIR: /storage
    volumes:
      - ./config:/config:ro
      - storage:/storage
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # Пока миграции не прошли, API не отвечает — по этому и ждём.
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 20s
    ports:
      # Наружу платформа смотрит через web (nginx), поэтому сам API открыт
      # только на сервере — для отладки и Swagger.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"

  worker:
    restart: unless-stopped
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sda}:${POSTGRES_PASSWORD:-sda}@db:5432/${POSTGRES_DB:-sda}
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /config
      STORAGE_DIR: /storage
    volumes:
      - ./config:/config:ro
      - storage:/storage
    depends_on:
      api: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: rq worker --url redis://redis:6379/0 nesting import

  web:
    restart: unless-stopped
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  storage:
