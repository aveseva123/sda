# Разворачивается на локальном сервере в цеху, интернет не требуется.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sda}
      POSTGRES_DB: ${POSTGRES_DB:-sda}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sda}"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sda}:${POSTGRES_PASSWORD:-sda}@db:5432/${POSTGRES_DB:-sda}
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /config
      STORAGE_DIR: /storage
    volumes:
      - ./config:/config:ro
      - storage:/storage
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"

  worker:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sda}:${POSTGRES_PASSWORD:-sda}@db:5432/${POSTGRES_DB:-sda}
      REDIS_URL: redis://redis:6379/0
      CONFIG_DIR: /config
      STORAGE_DIR: /storage
    volumes:
      - ./config:/config:ro
      - storage:/storage
    depends_on:
      api: {condition: service_started}
      redis: {condition: service_healthy}
    command: rq worker --url redis://redis:6379/0 nesting import

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  storage:
