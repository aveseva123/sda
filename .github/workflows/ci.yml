name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Системные библиотеки для Qt offscreen
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Окружение
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"
      - name: ruff
        run: .venv/bin/ruff format --check . && .venv/bin/ruff check .
      - name: mypy
        run: .venv/bin/mypy
      - name: pytest
        run: .venv/bin/python -m pytest
