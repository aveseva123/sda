# Deploys the static app to GitHub Pages (https://<owner>.github.io/<repo>/).
# configure-pages with `enablement: true` switches the repository to "GitHub Actions" Pages
# automatically on the first run; otherwise enable it in Settings → Pages → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/mobile-part-measurement-app-ps6ojn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate service-worker precache list
        run: node tools/gen-sw-manifest.mjs
      - name: Collect static files
        run: |
          mkdir -p dist
          cp -r index.html target.html target.svg manifest.webmanifest styles.css sw.js sw-manifest.js src vendor icons dist/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
