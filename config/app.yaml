# Общие настройки платформы. Единицы измерения — миллиметры, везде.
units: mm

geometry:
  # Допуск аппроксимации сплайнов и дуг (мм). Fusion 360 отдаёт сплайны — их
  # надо разложить в полилинию с контролируемой погрешностью.
  spline_tolerance: 0.05
  arc_tolerance: 0.05
  # Допуск сшивки разрывов контура (мм). Fusion часто отдаёт контур
  # несвязанными сегментами вместо замкнутой полилинии.
  stitch_tolerance: 0.01
  # Совпадающие сегменты ближе этого расстояния считаются дублями.
  duplicate_tolerance: 0.01
  # Контур короче этого периметра — мусор, отбрасывается.
  min_contour_perimeter: 0.5
  # Округление координат при выгрузке УП.
  nc_decimals: 3

# Расширяемый список толщин. Значения ниже — не ограничение, а подсказки
# для резолвера и выпадающих списков: любую толщину можно добавить из UI.
thicknesses:
  known: [3, 4, 6, 8, 10, 12, 15, 16, 18, 22, 25, 30, 36]
  # Допуск, с которым найденное в файле число сопоставляется с известной толщиной.
  match_tolerance: 0.6
  # Диапазон правдоподобия: числа вне него не считаются толщиной
  # (иначе "1200" из габарита уедет в толщину).
  min: 3
  max: 60

import:
  max_upload_mb: 512
  allowed_extensions: ['.dxf', '.zip', '.csv', '.xlsx', '.xls', '.xml']
  # Схлопывать одинаковые детали внутри одного изделия в позицию с количеством.
  deduplicate_within_product: true
  # Допуск сравнения габаритов при дедупликации (мм).
  dedup_tolerance: 0.1

labels:
  # Размер стикера подтверждён заказчиком: 120x75 мм, рулонный термопринтер.
  default_template: roll_120x75
  templates:
    - name: roll_120x75
      title: "Рулон 120 × 75 мм"
      width: 120
      height: 75
      margin: 3
      layout: single
    - name: a4_grid
      title: "Лист A4, сетка этикеток"
      width: 70
      height: 37
      margin: 2
      layout: grid
      page: {width: 210, height: 297, cols: 3, rows: 8, gap_x: 0, gap_y: 0}
  # Печать в PDF идёт в точных миллиметрах: масштабирование драйвером
  # принтера ломает соответствие мини-карты реальному листу.
  scale_to_fit: false

locale:
  default: ru
  available: [ru]

# Склад листов и деловой отход.
stock:
  # Обрезок меньше этих порогов деловым отходом не считается: его предлагается
  # списать в мусор, а не хранить. Пороги настраиваемые — у каждого цеха свои
  # представления о том, что «ещё пригодится».
  offcut:
    min_width: 100      # мм по короткой стороне
    min_length: 300     # мм по длинной стороне
    min_area_m2: 0.10   # площадь, ниже которой хранить невыгодно
  # Списывать лист со склада автоматически при отметке «отрезан».
  consume_on_cut: true
