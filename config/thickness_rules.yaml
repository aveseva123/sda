# Цепочка резолверов толщины и материала. Порядок в списке = приоритет.
# Каждый резолвер возвращает (значение, уверенность, источник) либо ничего.
# Если ни один не сработал — деталь уходит в очередь «требует уточнения».
# Молча угадывать запрещено.

# Порог доверия: результат ниже него не принимается молча — деталь идёт
# в очередь «требует уточнения» с показом, что именно сработало.
acceptance:
  min_confidence: 0.70
  # Толщина, которой нет в справочнике материалов, всегда подтверждается
  # технологом вручную, даже если распозналась уверенно.
  require_known_thickness: true
  # Насколько снижается доверие, если число правдоподобно, но такой толщины
  # нет в списке известных.
  unknown_thickness_penalty: 0.5

chain:
  - layer_map        # 1. слой DXF по сохранённому пресету слоёв
  - filename_token   # 2. токен в имени файла
  - folder_name      # 3. имя папки, в которой лежит файл
  - dxf_annotation   # 4. текстовая аннотация TEXT/MTEXT внутри DXF

filename_token:
  # Проверяются по порядку, первое совпадение выигрывает.
  # Именованная группа (?P<value> ...) обязательна.
  patterns:
    - name: t_prefix          # t18, T18
      regex: '(?i)(?:^|[^0-9a-z])t(?P<value>\d{1,2}(?:[.,]\d)?)(?:$|[^0-9])'
      confidence: 0.95
    - name: mm_suffix         # 18mm, 18 мм, 18MM
      regex: '(?i)(?P<value>\d{1,2}(?:[.,]\d)?)\s*(?:mm|мм)(?:$|[^0-9a-zа-я])'
      confidence: 0.95
    - name: delimited         # _18_, -18-, .18.
      regex: '[_\-\.\s](?P<value>\d{1,2}(?:[.,]\d)?)[_\-\.\s]'
      confidence: 0.75
    - name: trailing          # что-то_18.dxf
      regex: '[_\-\.\s](?P<value>\d{1,2}(?:[.,]\d)?)$'
      confidence: 0.70

folder_name:
  patterns:
    - name: folder_mm         # папка "18mm", "18 мм"
      regex: '(?i)(?P<value>\d{1,2}(?:[.,]\d)?)\s*(?:mm|мм)'
      confidence: 0.80
    - name: folder_bare       # папка "18"
      regex: '^(?P<value>\d{1,2}(?:[.,]\d)?)$'
      confidence: 0.70

dxf_annotation:
  # Текст ищется в TEXT/MTEXT, которые не являются геометрией.
  patterns:
    - name: labelled          # "толщина 18", "S=18", "thickness: 18"
      regex: '(?i)(?:толщина|толщ|thickness|thk|s)\s*[:=]?\s*(?P<value>\d{1,2}(?:[.,]\d)?)'
      confidence: 0.85

# Материал определяется отдельной цепочкой; при отсутствии — деталь получает
# толщину, но материал остаётся не назначенным (тоже повод для уточнения,
# т.к. раскрой идёт по паре «материал + толщина»).
material:
  filename_patterns:
    - name: known_alias
      # Список алиасов подставляется из справочника материалов на лету,
      # regex ниже — только форма токена.
      regex: '(?i)(?:^|[_\-\.\s])(?P<value>[a-zа-я]{3,})(?:$|[_\-\.\s])'
      confidence: 0.50
  # Если в справочнике ровно один материал нужной толщины — считать его
  # определённым. Выключить, если материалов одной толщины несколько и
  # ошибка недопустима.
  single_candidate_ok: true
  # Если в задании на импорт выбран материал по умолчанию — он применяется
  # к деталям, для которых материал не определился, но толщина известна.
  allow_default_from_batch: true
