# Библиотека фрез и магазин станка.
#
# Смена инструмента у Дайхонга ручная, поэтому важно, что именно стоит в
# магазине: слоты T1…T8. Фреза без слота лежит в ящике — платформа скажет
# оператору поставить её руками, а не сделает вид, что она в станке.
#
# Ресурс считается по пройденному В МАТЕРИАЛЕ пути (для свёрел — по числу
# отверстий), а не по времени работы шпинделя: холостые проходы фрезу не тупят.
#
# ⚠️ УТОЧНИТЬ: обороты, подачи и ресурсы взяты типовые для ЛДСП. Замените на
# те, что реально стоят у вас в NcStudio.

