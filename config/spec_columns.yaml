# Сопоставление колонок спецификации (Базис CSV/XLSX/XML) с полями детали.
# Алиасы сравниваются без учёта регистра, пробелов и знаков препинания.
# Реальные заголовки выгрузки Базиса надо будет добавить сюда после того,
# как заказчик пришлёт пример файла — код при этом не меняется.

# По какому полю строка спецификации связывается с DXF-файлом.
# Проверяется по порядку: сначала имя файла, затем артикул.
match_by: [source_file, code, part_name]

columns:
  source_file: ["файл", "имя файла", "dxf", "файл dxf", "filename", "file"]
  # Заказ — просто имя. Изделий и клиентов в платформе нет.
  order_name: ["заказ", "проект", "объект", "order", "project"]
  part_name: ["наименование", "деталь", "название", "name", "part"]
  code: ["артикул", "код", "обозначение", "code", "sku", "id"]
  qty: ["количество", "кол-во", "кол", "qty", "count"]
  length: ["длина", "габарит 1", "l", "length"]
  width: ["ширина", "габарит 2", "b", "w", "width"]
  thickness: ["толщина", "s", "t", "thickness"]
  material_name: ["материал", "плита", "material"]
  grain: ["текстура", "направление", "волокно", "grain"]
  edge_top: ["кромка верх", "кромка сверху", "кромка 1", "edge top"]
  edge_bottom: ["кромка низ", "кромка снизу", "кромка 2", "edge bottom"]
  edge_left: ["кромка лево", "кромка слева", "кромка 3", "edge left"]
  edge_right: ["кромка право", "кромка справа", "кромка 4", "edge right"]

# Значения текстуры → GrainMode.
grain_values:
  length: ["вдоль", "длина", "продольная", "along", "length", "да", "yes", "1"]
  width: ["поперёк", "поперек", "ширина", "across", "width"]
  none: ["нет", "без", "none", "no", "0", ""]

# Разделитель CSV определяется автоматически; здесь — кандидаты.
csv_delimiters: [";", ",", "\t", "|"]
csv_encodings: ["utf-8-sig", "cp1251", "utf-8"]

# Пути в XML-выгрузке Базиса. Уточняется по реальному файлу.
xml:
  row_xpath: ".//Деталь | .//Part | .//row"
  attribute_first: true
