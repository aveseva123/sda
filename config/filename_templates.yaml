# Шаблоны разбора имён файлов. Актуально для источников, которые не пишут
# метаданные в сам DXF: тогда они едут в имени файла.
# Если ни один шаблон не совпал — деталь идёт в очередь «требует уточнения».
#
# Поле «order» — это заказ, просто имя. Ни клиентов, ни изделий, ни сроков
# в платформе нет. Старое имя поля «project» продолжает работать как алиас.

default: fusion_full

templates:
  - name: fusion_full
    title: "Заказ_Группа_Деталь_Толщина_Количество"
    delimiter: "_"
    fields: [order, group, part, thickness, qty]
    # Пример: Kvartira12_Shkaf-prihozhaya_Bok-levyy_18_2.dxf
    example: "Kvartira12_Shkaf-prihozhaya_Bok-levyy_18_2.dxf"
    required: [part]

  - name: fusion_no_qty
    title: "Заказ_Группа_Деталь_Толщина"
    delimiter: "_"
    fields: [order, group, part, thickness]
    example: "Kvartira12_Shkaf-prihozhaya_Bok-levyy_18.dxf"
    required: [part]

  - name: product_part
    title: "Группа_Деталь_Толщина"
    delimiter: "_"
    fields: [group, part, thickness]
    example: "Shkaf-prihozhaya_Bok-levyy_18.dxf"
    required: [part]

  - name: part_only
    title: "Только имя детали"
    delimiter: "_"
    fields: [part]
    example: "Bok-levyy.dxf"
    required: [part]

# Приведение значений полей.
normalize:
  # Дефисы и подчёркивания в человекочитаемых полях заменяются пробелами.
  humanize_fields: [order, group, part]
  # Количество обязано быть целым >= 1, иначе поле считается не распознанным.
  qty_min: 1
  qty_max: 999
