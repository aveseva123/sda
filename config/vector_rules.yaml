# Распознавание технологических операций ПО ГЕОМЕТРИИ вектора.
#
# Слой и имя файла — только запасные подсказки. Причина простая: у одного
# источника слои осмысленные, у другого всё лежит в слое «0», и правило,
# опирающееся на слой, там не работает вовсе. Форма контура есть всегда.
#
#   замкнутый, самый внешний      -> раскрой по контуру
#   замкнутый внутри другого      -> вырез или карман, решает глубина
#   незамкнутая линия/полилиния   -> паз по центру, ширина = фреза
#   окружность ⌀3–35 мм           -> присадка, глубина по диаметру
#
# Слой при этом остаётся источником ГЛУБИНЫ там, где источник её пишет
# (Базис: «INSETS D 12.00»). Без глубины замкнутый внутренний контур
# неотличим от кармана: у выборки 12 мм на листе 16 мм тот же вид сверху,
# что у сквозного выреза.

drill:
  # Диапазон диаметров, при которых окружность считается присадкой.
  # Больше — это круглый вырез, а не отверстие под фурнитуру.
  min_diameter: 3.0
  max_diameter: 35.0
  # Окружность в DXF приходит аппроксимацией, и её эквивалентный диаметр
  # чуть меньше настоящего: у ⌀3 получается 2.998. Без допуска отверстие
  # ровно на границе диапазона потерялось бы.
  diameter_tolerance: 0.05
  # Насколько замкнутый контур должен быть похож на окружность, чтобы
  # считаться отверстием: отношение площади к площади описанного круга.
  circularity: 0.93

pocket:
  # Внутренний контур считается карманом, а не сквозным вырезом, если
  # объявленная глубина меньше толщины детали на эту величину.
  through_tolerance: 0.6

groove:
  # Незамкнутая цепочка короче этого — мусор, а не паз.
  min_length: 5.0

# Что делать, когда геометрия не даёт однозначного ответа.
fallback:
  # Использовать семантику слоя как подсказку.
  use_layer_semantic: true
  # Незамкнутый контур длиннее этого пробуем считать недошитой деталью
  # и сообщаем технологу, а не молча делаем из него паз.
  suspicious_open_length: 500.0

# Пороги, по которым технолог видит предупреждение.
warnings:
  # Контур не замкнут, но разрыв меньше — предложить сшить.
  stitchable_gap: 0.5
