# Пресеты сопоставления слоёв DXF → технологическая семантика.
#
# ВАЖНО: имена слоёв здесь НЕ являются истиной в последней инстанции.
# Это лишь стартовые подсказки для Мастера сопоставления слоёв: при первом
# импорте из нового источника пользователь видит реальные слои файла и
# назначает семантику сам, после чего пресет сохраняется в БД и
# перекрывает содержимое этого файла.
#
# Семантики: OUTER, INNER, DRILL, GROOVE, POCKET, MARK, INFO, IGNORE

semantics:
  SHEET:  {title: "Контур листа",     cut: false, offset: none,    through: false}
  OUTER:  {title: "Внешний контур",   cut: true,  offset: outside, through: true}
  INNER:  {title: "Внутренний вырез", cut: true,  offset: inside,  through: true}
  DRILL:  {title: "Присадка",         cut: true,  offset: none,    through: false}
  GROOVE: {title: "Паз",              cut: true,  offset: center,  through: false}
  POCKET: {title: "Выборка",          cut: true,  offset: inside,  through: false}
  MARK:   {title: "Гравировка",       cut: false, offset: center,  through: false}
  INFO:   {title: "Метаданные",       cut: false, offset: none,    through: false}
  IGNORE: {title: "Игнорировать",     cut: false, offset: none,    through: false}

# Извлечение технологических параметров прямо из имени слоя.
#
# Подтверждено эталонными файлами заказчика: Базис пишет в имя слоя глубину
# обработки и диаметр отверстия. Это важнее, чем кажется: DXF двумерен и
# обычно глубину не несёт, поэтому в ТЗ она задавалась только правилами.
# Для этого источника глубина есть в файле, и она достовернее правил.
#
#   PERIMETER D 16.00          -> глубина 16.00 мм
#   PERIMETER D 12.000         -> глубина 12.000 мм (бывает три знака)
#   INSETS D 6.00              -> глубина 6.00 мм
#   HOLES DIAM 4.00 D 16.00    -> отверстие ⌀4.00 на глубину 16.00 мм
layer_attributes:
  depth:
    # «D» отдельным словом, дальше число. «DIAM» под это не подходит:
    # после D идёт буква, а не цифра.
    regex: '(?i)(?:^|[\s_-])D[\s_-]*(?P<value>\d+(?:[.,]\d+)?)'
  hole_diameter:
    regex: '(?i)DIAM[\s_-]*(?P<value>\d+(?:[.,]\d+)?)'

# Определение источника по сигнатуре DXF-файла ($ACADVER, комментарии,
# набор системных переменных, характерные имена блоков).
source_detection:
  - source: bazis
    title: "Базис-Мебельщик"
    signals:
      header_contains: ["BAZIS", "БАЗИС", "Bazis"]
      # Надёжная подпись: слой BOARDS с контурами листов плюс слои
      # PERIMETER/CUTOUTS/INSETS/HOLES с глубиной в имени.
      layer_name_regex: '(?i)^(BOARDS?|PERIMETER|CUTOUTS?|INSETS?|HOLES?)\b'
      weight: 1.0
  - source: fusion
    title: "Autodesk Fusion 360"
    signals:
      header_contains: ["Fusion", "Autodesk", "ACAD"]
      # Fusion характерен тем, что кладёт всё в слой 0 или в слои по эскизам.
      layer_name_regex: '(?i)^(0|sketch|эскиз)'
      weight: 0.6

# Стартовые пресеты. Пользователь правит их в мастере; сохранённая версия
# живёт в таблице layer_presets и имеет приоритет над этим файлом.
presets:
  - name: "Базис"
    source: bazis
    # Имена слоёв взяты из эталонных файлов заказчика, а не из догадок.
    # Проверяются по порядку, первое совпадение выигрывает.
    rules:
      # Контур ЛИСТА, а не детали. Даёт габарит листа и не режется.
      - {regex: '(?i)^BOARDS?$',      semantic: SHEET}
      - {regex: '(?i)^PERIMETER',     semantic: OUTER}
      - {regex: '(?i)^CUTOUTS?',      semantic: INNER}
      - {regex: '(?i)^HOLES?',        semantic: DRILL}
      - {regex: '(?i)^INSETS?',       semantic: POCKET}
      - {regex: '(?i)^GROOVES?',      semantic: GROOVE}
      - {regex: '(?i)^(MARK|ENGRAV)', semantic: MARK}
      - {regex: '(?i)^(TEXT|INFO|FRAME|DIM)', semantic: INFO}
    # Толщина берётся не из имени слоя напрямую, а из глубины контура:
    # см. резолвер layer_depth в config/thickness_rules.yaml.
    thickness_from_layer_regex: null

  - name: "Fusion"
    source: fusion
    # Fusion не несёт мебельной семантики: по умолчанию всё, что есть,
    # трактуем как геометрию контуров и разбираем по вложенности площадей,
    # а не по слоям.
    rules:
      - {regex: '(?i)(drill|hole|отверст)', semantic: DRILL}
      - {regex: '(?i)(groove|slot|паз)',    semantic: GROOVE}
      # circles_as_drill: окружность мебельного диаметра (чашка петли ⌀35,
      # шкант ⌀8 и т.п.) трактуется как присадка, а не как сквозной вырез.
      # Флаг включается осознанно в мастере слоёв; молча ничего не решается.
      - {regex: '.*', semantic: OUTER, resolve_nesting_by_area: true, circles_as_drill: true}
    thickness_from_layer_regex: null

# Диаметры, при которых окружность на контурном слое считается присадкой
# (используется только при включённом circles_as_drill и в подсказках мастера).
drill_diameters:
  # ⌀4 подтверждён эталонными файлами: «HOLES DIAM 4.00 D 16.00».
  values: [4, 5, 6, 8, 10, 12, 15, 20, 26, 35]
  tolerance: 0.6
